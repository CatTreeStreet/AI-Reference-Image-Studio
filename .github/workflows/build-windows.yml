name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name 16oz-Tumbler-Wrap-AI-Studio app.py
      - uses: actions/upload-artifact@v4
        with:
          name: 16oz-Tumbler-Wrap-AI-Studio-Windows
          path: dist/16oz-Tumbler-Wrap-AI-Studio.exe
          if-no-files-found: error
